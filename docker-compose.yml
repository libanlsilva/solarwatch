name: solarwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solarwatch
      POSTGRES_USER: solarwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solarwatch -d solarwatch']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
