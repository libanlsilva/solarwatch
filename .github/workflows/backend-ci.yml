name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: solarwatch
          POSTGRES_DB: solarwatch_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solarwatch -d solarwatch_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOLARWATCH_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=solarwatch_tests;Username=solarwatch

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/src/SolarWatch.slnx

      - name: Build
        run: dotnet build backend/src/SolarWatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/src/SolarWatch.slnx --configuration Release --no-build --no-restore
